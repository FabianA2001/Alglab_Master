[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alglab-master"
version = "0.1.0"
description = "#TODO"
requires-python = ">=3.10"
dependencies = [
    "ortools>=9.11.4210",
    "pydantic",
    "pandas",
    "streamlit"
    
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "cpsat-utils"
]

[project.scripts]
main = "src.main:main"
lns-find = "src.LNS.find_lns_parameter:main"
lns-show = "src.LNS.show_parameter:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
]
